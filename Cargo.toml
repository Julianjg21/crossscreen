[workspace]
resolver = "2"
members = [
    "crates/cs-core",
    "crates/cs-protocol",
    "crates/cs-security",
    "crates/cs-transport",
    "crates/cs-discovery",
    "crates/cs-session",
    "crates/cs-display",
    "crates/cs-encode",
    "crates/cs-capture",
    "apps/cli",
    "apps/helper",
    "crates/cs-decode",
    "crates/cs-render",
    "apps/viewer",
    "crates/cs-ipc",
    "apps/agent",
    "apps/desktop/src-tauri",
    "crates/cs-pipeline",
    "crates/cs-input",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Julianjg21/crossscreen"
publish = false

[workspace.dependencies]
cs-core = { path = "crates/cs-core" }
cs-protocol = { path = "crates/cs-protocol" }
cs-security = { path = "crates/cs-security" }
cs-transport = { path = "crates/cs-transport" }
cs-discovery = { path = "crates/cs-discovery" }
cs-session = { path = "crates/cs-session" }
cs-display = { path = "crates/cs-display" }
cs-ipc = { path = "crates/cs-ipc" }

serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
bytes = "1"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
subtle = "2"
spake2 = { version = "0.4", features = ["std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio", "log"] }
reed-solomon-simd = "3"
mdns-sd = "0.13"
proptest = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
