[package]
name = "cs-pipeline"
description = "Pipeline emisor de CrossScreen: monitor virtual → captura GPU → H.264 por hardware → datagramas QUIC con pacing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cs-core.workspace = true
cs-protocol.workspace = true
cs-security.workspace = true
cs-transport.workspace = true
cs-display.workspace = true
cs-input = { path = "../cs-input" }
cs-clipboard = { path = "../cs-clipboard" }
cs-capture = { path = "../cs-capture" }
cs-encode = { path = "../cs-encode" }
anyhow.workspace = true
bytes.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[dev-dependencies]
cs-security.workspace = true
clap.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["signal"] }

[lints]
workspace = true
