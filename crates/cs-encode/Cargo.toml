[package]
name = "cs-encode"
description = "Codificación H.264 de CrossScreen (Media Foundation en Windows y OpenH264 en Linux)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cs-core.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Security",
] }

[target.'cfg(not(windows))'.dependencies]
openh264 = { version = "0.9", default-features = false, features = ["libloading"] }
# Instalación de OpenH264 desde el panel: HTTP sin TLS (la integridad la da
# el SHA-256 fijado) y descompresión bzip2 en Rust puro.
ureq = { version = "2", default-features = false }
bzip2-rs = "0.1"
sha2.workspace = true

[dev-dependencies]
anyhow.workspace = true

[target.'cfg(windows)'.dev-dependencies]
cs-decode = { path = "../cs-decode" }

[lints]
workspace = true
