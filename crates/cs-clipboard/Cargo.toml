[package]
name = "cs-clipboard"
description = "Sincronización bidireccional del portapapeles de texto (F7) con prevención de bucles y backend Win32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cs-protocol.workspace = true
sha2.workspace = true
