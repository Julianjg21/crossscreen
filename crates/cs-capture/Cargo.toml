[package]
name = "cs-capture"
description = "Captura de monitores en GPU de CrossScreen (DXGI Desktop Duplication en Windows)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
linux-pipewire = [
    "dep:pipewire",
    "dep:pipewire-sys",
    "dep:libspa",
    "dep:libspa-sys",
]

[dependencies]
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Performance",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# Solo el bench: ventana animada en el monitor capturado.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
pipewire = { version = "0.3", optional = true }
pipewire-sys = { package = "pipewire-sys", version = "=0.6.0", optional = true }
libspa = { package = "libspa", version = "=0.6.0", optional = true }
libspa-sys = { package = "libspa-sys", version = "=0.6.0", optional = true }

[lints]
workspace = true
