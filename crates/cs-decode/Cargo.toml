[package]
name = "cs-decode"
description = "Decodificación de vídeo H.264 por hardware para el visor de CrossScreen (Media Foundation + D3D11 en Windows)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cs-core.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_Media_MediaFoundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

# Fuera de Windows: decodificación por software con OpenH264. Se carga en
# tiempo de ejecución el binario oficial de Cisco (licencia de patentes de
# H.264 cubierta por Cisco); el crate verifica su hash SHA-256.
[target.'cfg(not(windows))'.dependencies]
openh264 = { version = "0.9", default-features = false, features = ["libloading"] }

[dev-dependencies]
anyhow.workspace = true

[lints]
workspace = true
