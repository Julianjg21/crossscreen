name: Release

# Se publica al subir una etiqueta, p. ej.:  git tag v0.0.1-alpha.1 && git push origin v0.0.1-alpha.1
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Tests (crates portables y de Windows sin pantalla)
        run: cargo test --workspace --exclude crossscreen-desktop
      - name: Compilar, firmar (si hay certificado) y empaquetar
        shell: pwsh
        # Sin estos secretos se publica sin firma (ver scripts/sign-windows.ps1).
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./scripts/package-windows.ps1
      - name: Artefacto del workflow
        uses: actions/upload-artifact@v4
        with:
          name: crossscreen-windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
      - name: Publicar release (solo con etiqueta)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*-setup.exe
          prerelease: true
          generate_release_notes: true
          body: |
            Versión de prueba (alfa).
            Windows: `CrossScreen_*_x64-setup.exe` instala el panel, el agente y el visor en Program Files, con acceso directo en el menú Inicio, desinstalador y reglas del firewall (solo redes privadas). El `.zip` es la versión portable. Si la release no está firmada, Windows SmartScreen puede avisar («Más información» → «Ejecutar de todas formas»).
            Instrucciones para probar entre dos equipos: `PRUEBA-DOS-EQUIPOS.md`.
            Linux (Ubuntu como pantalla, Windows → Linux): `crossscreen-*-linux-x64.tar.gz`, guía `RECEPTOR-LINUX.md` dentro.
            En Linux x86_64, el panel visual se publica también como `.AppImage` y `.deb`; el agente Linux va incluido como recurso.

  linux:
    name: Linux x64 (receptor e instalador visual)
    runs-on: ubuntu-24.04 # PipeWire/libspa headers compatibles con bindings 0.7.x
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libpipewire-0.3-dev clang libclang-dev pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev file
      - name: Compilar y empaquetar
        run: ./scripts/package-linux.sh
      - name: Compilar instalador visual
        run: ./scripts/package-linux-desktop.sh
      - name: Artefacto del workflow
        uses: actions/upload-artifact@v4
        with:
          name: crossscreen-linux-x64
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.deb
      - name: Publicar en la release (solo con etiqueta)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.deb
          prerelease: true
