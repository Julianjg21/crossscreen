name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  windows:
    name: Windows (workspace completo)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      # El panel Tauri incrusta `apps/desktop/dist` al compilar: hay que generarlo antes.
      - name: Frontend del panel
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: Formato
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Tests
        run: cargo test --workspace

  linux:
    name: Linux (crates portables)
    runs-on: ubuntu-24.04
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
      LD_LIBRARY_PATH: /usr/lib/llvm-18/lib:/usr/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias del sistema (ventana X11/Wayland y PipeWire)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libpipewire-0.3-dev clang libclang-dev
      # El emisor Linux usa Portal/PipeWire y OpenH264 por software; el modo
      # extender y la entrada/portapapeles siguen siendo trabajo posterior.
      - name: Clippy y tests
        run: |
          PKGS="-p cs-core -p cs-protocol -p cs-security -p cs-transport -p cs-discovery -p cs-session -p cs-ipc -p cs-capture -p cs-encode -p cs-pipeline"
          VIEWER="-p cs-decode -p cs-render -p crossscreen-viewer -p crossscreen-cli"
          cargo clippy $PKGS $VIEWER --all-targets -- -D warnings
          cargo test $PKGS
          cargo clippy -p cs-capture --features linux-pipewire --all-targets -- -D warnings
          cargo clippy -p cs-pipeline --all-targets -- -D warnings
          cargo test -p cs-render

  licenses:
    name: Licencias y advisories (cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
