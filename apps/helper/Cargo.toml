[package]
name = "crossscreen-helper"
description = "Helper privilegiado de CrossScreen: instala y desinstala el driver de monitor virtual"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "crossscreen-helper"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
sha2.workspace = true
hex.workspace = true
serde.workspace = true
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_UI_Shell",
] }

[lints]
workspace = true
