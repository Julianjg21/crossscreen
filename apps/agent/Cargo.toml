[package]
name = "crossscreen-agent"
description = "Agente de CrossScreen: daemon de usuario que posee la identidad, el emparejamiento, el descubrimiento y los monitores virtuales, y atiende a la UI por IPC local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "crossscreen-agent"
path = "src/main.rs"

[dependencies]
cs-core.workspace = true
cs-protocol.workspace = true
cs-security.workspace = true
cs-transport.workspace = true
cs-discovery.workspace = true
cs-display.workspace = true
cs-ipc.workspace = true
cs-pipeline = { path = "../../crates/cs-pipeline" }
anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["signal", "process"] }
cs-log.workspace = true
tracing.workspace = true
serde_json = "1"
serde.workspace = true
directories = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Console"] }

[target.'cfg(not(windows))'.dependencies]
# Instalación de OpenH264 desde el panel.
cs-encode = { path = "../../crates/cs-encode" }

[lints]
workspace = true
